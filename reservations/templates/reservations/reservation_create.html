<form method="post" action="{% url 'reservations:reservation_create' %}" class="js-entity-create-form">
    {% csrf_token %}
    <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
            <i class="fa fa-calendar-check"></i> Créer une Nouvelle Réservation
        </h5>
        <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        {% include 'reservations/reservation_form.html' %}
    </div>
    <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">
            <i class="fa fa-times"></i> Annuler
        </button>
        <button type="submit" class="btn btn-primary">
            <i class="fa fa-save"></i> Créer la Réservation
        </button>
    </div>
</form>
