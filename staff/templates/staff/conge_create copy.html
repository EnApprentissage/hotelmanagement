<!-- Modal pour création d'un congé -->
<form method="post" action="{% url 'staff:conge_create' %}" class="js-entity-create-form">
    {% csrf_token %}
    
    <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
            <i class="cil-calendar-plus"></i> Créer un Nouveau Congé
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body">
        {% include 'staff/conge_form.html' %}
    </div>

    <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
        <i class="cil-x"></i> Annuler
    </button>
    <button type="submit" class="btn btn-primary">
        <i class="cil-check"></i> Créer le Congé
    </button>
</div>
</form>
