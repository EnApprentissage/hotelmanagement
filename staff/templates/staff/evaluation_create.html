<!-- Modal pour création d'une évaluation -->
<form method="post" action="{% url 'staff:evaluation_create' %}" class="js-entity-create-form">
    {% csrf_token %}
    
    <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
            <i class="cil-star"></i> Créer une Nouvelle Évaluation
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body">
        {% include 'staff/evaluation_form.html' %}
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="cil-x"></i> Annuler
        </button>
        <button type="submit" class="btn btn-primary">
            <i class="cil-check"></i> Créer l'Évaluation
        </button>
    </div>
</form>
