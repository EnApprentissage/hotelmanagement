<!-- Modal pour modification d'un congé -->
<form method="post" action="{% url 'staff:conge_update' form.instance.pk %}" class="js-entity-update-form" id="form-conge-update">
    {% csrf_token %}
    
    <div class="modal-header bg-warning text-white">
        <h5 class="modal-title">
            {% if object.is_locked %}
                <i class="fas fa-lock"></i> Congé Verrouillé
            {% else %}
                <i class="fas fa-edit"></i> Mettre à jour le Congé
            {% endif %}
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body">
        {% if object.is_locked %}
            <div class="alert alert-warning mb-3">
                <i class="fas fa-lock"></i> 
                <strong>Congé verrouillé</strong> - Ce congé ne peut plus être modifié.
            </div>
        {% endif %}
        
        {% include 'staff/conge_form.html' %}
    </div>

    <div class="modal-footer">
        {% if object.is_locked %}
            <!-- 🔒 CONGÉ VERROUILLÉ -->
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                <i class="cil-x"></i> Fermer
            </button>
        {% else %}
            <!-- ✏️ CONGÉ NON VERROUILLÉ -->
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                <i class="cil-x"></i> Annuler
            </button>
            
            <!-- Bouton Mettre à jour normal -->
            <button type="button" class="btn btn-warning btn-update-normal">
                <i class="cil-check"></i> Mettre à jour
            </button>
            
            <!-- Bouton Valider et Verrouiller -->
            <button type="button" class="btn btn-success btn-validate-lock">
                <i class="fas fa-lock"></i> Valider et Verrouiller
            </button>
        {% endif %}
    </div>
</form>
