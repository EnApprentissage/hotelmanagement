<!-- Modal pour modification d'un incident -->
<form method="post" action="{% url 'staff:incident_update' object.pk %}" class="js-entity-update-form" id="form-incident-update">
    {% csrf_token %}

    <div class="modal-header bg-warning text-white">
        <h5 class="modal-title">
            {% if object.is_locked %}
                <i class="fas fa-lock"></i> Incident Verrouillé
            {% else %}
                <i class="cil-pencil"></i> Modifier l'Incident
            {% endif %}
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body">
        {% if object.is_locked %}
            <div class="alert alert-warning mb-3">
                <i class="fas fa-lock"></i> 
                <strong>Incident verrouillé</strong> - Cet incident ne peut plus être modifié.
            </div>
        {% endif %}
        
        {% include 'staff/incident_form.html' %}
    </div>

    <div class="modal-footer">
        {% if object.is_locked %}
            <!-- 🔒 INCIDENT VERROUILLÉ -->
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                <i class="cil-x"></i> Fermer
            </button>
        {% else %}
            <!-- ✏️ INCIDENT NON VERROUILLÉ -->
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                <i class="cil-x"></i> Annuler
            </button>
            
            <!-- Bouton Mettre à jour normal -->
            <button type="button" class="btn btn-warning text-white btn-update-normal">
                <i class="cil-check"></i> Mettre à jour
            </button>
            
            <!-- Bouton Valider et Verrouiller -->
            <button type="button" class="btn btn-success btn-validate-lock">
                <i class="fas fa-lock"></i> Valider et Verrouiller
            </button>
        {% endif %}
    </div>
</form>
